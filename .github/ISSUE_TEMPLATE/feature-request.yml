name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the form below.

  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: Is your feature request related to a problem? Describe it.
      placeholder: A clear and concise description of what the problem is. E.g., "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see.
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
      placeholder: Any alternatives you've thought about...
    validations:
      required: false

  - type: dropdown
    id: package
    attributes:
      label: Related Package(s)
      description: Which package(s) would this feature affect?
      multiple: true
      options:
        - "@uploadista/core"
        - "@uploadista/client"
        - "@uploadista/server"
        - "Data Stores (S3, Azure, GCS, Filesystem)"
        - "KV Stores (Redis, Cloudflare KV/DO)"
        - "Flow Nodes"
        - "New Package"
        - "Other"
    validations:
      required: false

  - type: dropdown
    id: type
    attributes:
      label: Feature Type
      description: What type of feature is this?
      options:
        - New functionality
        - Performance improvement
        - Developer experience
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or examples.
      placeholder: Any additional information...
    validations:
      required: false
