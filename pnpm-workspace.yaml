packages:
  - packages/**/*
  - examples/**/*

# @cloudflare/workers-types is official, type-only, and publishes a new
# date-stamped release daily — exempt it from the minimum release-age check.
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types'
  - '@vue/language-core@3.3.7'
  - vue-tsc@3.3.7
  - hono@4.12.34

allowBuilds:
  '@seydx/node-av-darwin-x64': true
  '@seydx/node-av-darwin-arm64': true
  '@seydx/node-av-linux-x64': true
  '@seydx/node-av-linux-arm64': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  esbuild: true
  msgpackr-extract: true
  node-av: true
  nx: true
  protobufjs: true
  react-native-nitro-modules: true
  sharp: true
  unrs-resolver: true
  workerd: true

catalog:
  '@effect/vitest': 0.29.0
  '@types/node': 24.10.9
  effect: 3.22.1
  hono: 4.13.2
  react: 19.2.8
  react-dom: 19.2.8
  react-router: 8.3.0
  tsdown: 0.22.3
  typescript: 7.0.2
  zod: 4.4.3
